backend:
  name: github
  repo: sleepyzsims/sleepyz-site
  branch: main
  squash_merges: true
  base_url: https://decap-cms-oauth.sleepyzzsims.workers.dev

media_folder: assets/uploads
public_folder: /assets/uploads

site_url: https://sleepyz-site.pages.dev

# To add a new option later, add a label/value pair to the relevant options list.

collections:
  - name: catalog
    label: CC Catalog
    label_singular: CC Item
    folder: content/cc
    create: true
    extension: json
    format: json
    identifier_field: name
    slug: "{{slug}}"

    fields:
      - { label: Name, name: name, widget: string }

      - { label: Preview Image, name: image, widget: image }

      - label: Age
        name: ages
        widget: select
        multiple: true
        required: false
        options:
          - { label: Adult, value: adult }
          - { label: Child, value: child }
          - { label: Toddler, value: toddler }
          - { label: Infant, value: infant }

      - label: Item
        name: item
        widget: select
        multiple: true
        required: false
        options:
          - { label: Hair, value: hair }
          - { label: Clothes, value: clothes }
          - { label: Shoes, value: shoes }
          - { label: Accessory, value: accessory }

      - label: Type
        name: types
        widget: select
        multiple: true
        required: false
        options:
          - { label: Conversion, value: conversion }
          - { label: New Mesh, value: new }
          - { label: Recolor, value: recolor }

      - label: Hair Type
        name: hair_type
        widget: select
        multiple: true
        required: false
        options:
          - { label: Straight, value: straight }
          - { label: Curly/Wavy, value: curly/wavy }
          - { label: Updo, value: updo }
          - { label: Braids/Twists, value: braids/twists }

      - { label: Description, name: description, widget: text, required: false }

      - { label: Original Creator, name: creator, widget: string, required: false }

      - { label: Creator Link, name: creator_url, widget: string, required: false }

      - { label: Download Link, name: download, widget: string }

  - name: resources
    label: Resources / Programs
    files:
      - label: Resources
        name: resources
        file: content/resources.json
        format: json
        fields:
          - label: Resources
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Link, name: link, widget: string }
              - { label: Image, name: image, widget: image, required: false }                required: false
                options:
                  - { label: Adult, value: adult }
                  - { label: Child, value: child }
                  - { label: Toddler, value: toddler }
                  - { label: Infant, value: infant }
              - label: Item
                name: item
                widget: select
                multiple: true
                required: false
                options:
                  - { label: Hair, value: hair }
                  - { label: Clothes, value: clothes }
                  - { label: Shoes, value: shoes }
                  - { label: Accessory, value: accessory }
              - label: Type
                name: types
                widget: select
                multiple: true
                required: false
                options:
                  - { label: Conversion, value: conversion }
                  - { label: New Mesh, value: new }
                  - { label: Recolor, value: recolor }
              - label: Hair Type
                name: hair_type
                widget: select
                multiple: true
                required: false
                options:
                  - { label: Straight, value: straight }
                  - { label: Curly/Wavy, value: curly/wavy }
                  - { label: Updo, value: updo }
                  - { label: Braids/Twists/Locs, value: braids/twists }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Original Creator, name: creator, widget: string, required: false }
              - { label: Creator Link, name: creator_url, widget: string, required: false }
              - { label: Download Link, name: download, widget: string }

  - name: resources
    label: Resources / Programs
    files:
      - label: Resources
        name: resources
        file: content/resources.json
        format: json
        fields:
          - label: Resources
            name: items
            widget: list
            add_to_top: true
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Link, name: link, widget: string }
              - { label: Image, name: image, widget: image, required: false }
