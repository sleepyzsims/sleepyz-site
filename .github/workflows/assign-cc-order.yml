name: Assign CC Order and Build Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'content/cc/*.json'

permissions:
  contents: write

jobs:
  assign-order:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assign order numbers
        run: node .github/scripts/assign-cc-order.js

      - name: Build catalog
        run: node build-catalog.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/cc
          git add content/cc.json

          git commit -m "Assign CC order numbers and rebuild catalog"
          git push
